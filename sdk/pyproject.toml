[project]
name = "telemetry-taco-sdk"
version = "0.1.0"
description = "Python SDK for TelemetryTaco."
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["telemetry_taco*"]

[tool.pytest.ini_options]
pythonpath = ["."]
