name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "20"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install backend dependencies
        working-directory: ./backend
        run: poetry install --no-interaction --no-ansi

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint backend
        working-directory: ./backend
        run: poetry run ruff check .

      - name: Check backend formatting
        working-directory: ./backend
        run: poetry run ruff format --check .

      - name: Django system check
        working-directory: ./backend
        env:
          DJANGO_SETTINGS_MODULE: telemetry_taco.settings.test
        run: poetry run python manage.py check

      - name: Run backend tests
        working-directory: ./backend
        env:
          POETRY_CACHE_DIR: /tmp/pypoetry-cache
        run: poetry run pytest

      - name: Export OpenAPI schema
        working-directory: ./backend
        env:
          DJANGO_SETTINGS_MODULE: telemetry_taco.settings.test
        run: poetry run python manage.py export_openapi_schema ../frontend/openapi.json

      - name: Verify generated frontend API types
        working-directory: ./frontend
        run: |
          pnpm generate:api-types
          git diff --exit-code src/shared/api/generated.ts openapi.json

      - name: Lint frontend
        working-directory: ./frontend
        run: pnpm lint

      - name: Type-check frontend
        working-directory: ./frontend
        run: pnpm type-check

      - name: Run frontend tests
        working-directory: ./frontend
        run: pnpm test

      - name: Build frontend
        working-directory: ./frontend
        run: pnpm build

      - name: Run SDK tests
        working-directory: ./sdk
        run: |
          PYTEST_PYTHON=$(poetry -C ../backend run python -c 'import sys; print(sys.executable)')
          "$PYTEST_PYTHON" -m pytest tests

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install backend dependencies
        working-directory: ./backend
        run: poetry install --no-interaction --no-ansi

      - name: Run Bandit
        working-directory: ./backend
        run: poetry run bandit -r . -c bandit.yaml

  codeql-analysis:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql-config.yml

      - name: Set up Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        if: matrix.language == 'python'
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install backend dependencies
        if: matrix.language == 'python'
        working-directory: ./backend
        run: poetry install --no-interaction --no-ansi

      - name: Set up pnpm
        if: matrix.language == 'javascript'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        if: matrix.language == 'javascript'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install JavaScript dependencies
        if: matrix.language == 'javascript'
        run: pnpm install --frozen-lockfile

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
